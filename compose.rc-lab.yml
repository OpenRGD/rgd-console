# Standalone synthetic acceptance lab. Never combine with docker-compose.yml.
name: openrgd-console-rc-lab
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      labels:
        org.opencontainers.image.revision: ${CONSOLE_RC_SHA:?Exact candidate Git SHA required}
        org.opencontainers.image.version: console-025a-lab
    environment:
      CONSOLE_BIND: 0.0.0.0:8080
      CONSOLE_ROBOTS_FILE: /app/config/robots.json
      CONSOLE_MODULES_FILE: /app/config/modules.json
      CONSOLE_DATA_DIR: /app/data
      RUST_LOG: info
      CONSOLE_MODULE_AGENT_URL: http://module-agent:8090
      CONSOLE_BOOT_MANAGER_URL: http://boot-manager:8091
      CONSOLE_IMU_INGEST_TOKEN: ""
      CONSOLE_IMU_ALLOWED_ROBOT_IDS: ""
      CONSOLE_ALLOWED_ORIGINS: ""
    volumes:
      - ./deploy/rc-lab/robots.json:/app/config/robots.json:ro,Z
      - ./.github/fixtures/modules.json:/app/config/modules.json:ro,Z
      - console_data:/app/data
    expose:
      - "8080"
    networks: [default, boot-internal, lab-agent]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      labels:
        org.opencontainers.image.revision: ${CONSOLE_RC_SHA:?Exact candidate Git SHA required}
        org.opencontainers.image.version: console-025a-lab
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

  module-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.module-agent
      labels:
        org.opencontainers.image.revision: ${CONSOLE_RC_SHA:?Exact candidate Git SHA required}
        org.opencontainers.image.version: console-025a-lab
    environment:
      OPENRGD_MODULE_DATA_DIR: /app/data
      CARGO_HOME: /app/data/cargo
      HOME: /app/data
      RUSTUP_HOME: /usr/local/rustup
    volumes:
      - module_data:/app/data
    expose:
      - "8090"
    networks: [lab-agent]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    restart: "no"

  boot-manager:
    build:
      context: .
      dockerfile: deploy/Dockerfile.boot-manager
      labels:
        org.opencontainers.image.revision: ${CONSOLE_RC_SHA:?Exact candidate Git SHA required}
        org.opencontainers.image.version: console-025a-lab
    environment:
      OPENRGD_CONSOLE_DATA_DIR: /app/console-data
      OPENRGD_BOOT_DATA_DIR: /app/boot-data
      OPENRGD_RGD_BIN: /usr/local/bin/rgd
    volumes:
      - type: volume
        source: console_data
        target: /app/console-data
        read_only: true
        volume:
          nocopy: true
      - boot_data:/app/boot-data
    depends_on:
      - api
    expose: ["8091"]
    networks: [boot-internal]
    group_add:
      - "10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    restart: "no"

  gateway:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:8188:8080"
    volumes:
      - ./deploy/rc-lab/Caddyfile:/etc/caddy/Caddyfile:ro,Z
    depends_on:
      - api
      - web
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: "no"

volumes:
  console_data:
  module_data:
  boot_data:

networks:
  boot-internal:
    internal: true
  lab-agent:
    internal: true
