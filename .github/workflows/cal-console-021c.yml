name: CAL-CONSOLE-021C pinned consumer conformance
on:
  pull_request:
    paths:
      - 'services/module-agent/calibration*'
      - 'services/module-agent/calibration-contracts/**'
      - 'services/module-agent/tests/**'
      - 'contracts/console/v1/calibration-inspection.v0.4b.schema.json'
      - 'services/api/src/module_manager.rs'
      - 'apps/web/src/components/calibration-inspector.tsx'
      - 'scripts/test_calibration_consumer_compat.py'
      - '.github/workflows/cal-console-021c.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-cal-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-calibration
          ref: 646dbc05bcefd15942b25bb55b3c99096f0cccc9
          path: .upstream/cal
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-calibration
          ref: 81700401e2fa6d370a86b6c1f5a48802bc5f1fc7
          path: .upstream/legacy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-modules
          ref: 0268b3748042d04fd3561553616388368881e04a
          path: .upstream/registry
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify exact upstream bytes and schema IDs
        run: |
          test "$(git -C .upstream/cal rev-parse HEAD)" = 646dbc05bcefd15942b25bb55b3c99096f0cccc9
          test "$(git -C .upstream/legacy rev-parse HEAD)" = 81700401e2fa6d370a86b6c1f5a48802bc5f1fc7
          test "$(git -C .upstream/registry rev-parse HEAD)" = 0268b3748042d04fd3561553616388368881e04a
          cmp .upstream/cal/contracts/passive-report.v0.2.schema.json services/module-agent/calibration-contracts/passive-report.v0.2.schema.json
          cmp .upstream/cal/contracts/calibration-profile.v0.1.schema.json services/module-agent/calibration-contracts/calibration-profile.v0.1.schema.json
          cmp .upstream/cal/LICENSE services/module-agent/calibration-contracts/LICENSE
      - run: python -m pip install 'jsonschema[format]==4.23.0' 'typer>=0.9.0' 'rich>=13.0.0'
      - name: Build both actual CLI binaries (not install)
        run: |
          cargo build --locked --manifest-path .upstream/legacy/Cargo.toml --bin rgd-calibration
          cargo build --locked --manifest-path .upstream/cal/Cargo.toml --bin rgd-calibration
      - name: Actual Console agent / two CAL binaries / corpus (synthetic only)
        run: |
          python scripts/test_calibration_consumer_compat.py --cal .upstream/cal --registry .upstream/registry \
            --legacy-binary .upstream/legacy/target/debug/rgd-calibration \
            --candidate-binary .upstream/cal/target/debug/rgd-calibration
