name: PERIPH-CONSOLE-01 pinned read-only consumer
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/periph-*.ts'
      - 'apps/web/src/components/peripherals-panel.tsx'
      - 'apps/web/package.json'
      - 'release/periph-consumer-pin.json'
      - 'scripts/*periph*'
      - 'contracts/console/v1/peripheral-*.schema.json'
      - '.github/workflows/periph-console-01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-periph-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenRGD/rgd-periph
          ref: a36c2d7c42b0bb3f4b2e4c78b42b999be0fac6cd
          path: _interop/periph
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.100.0'
      - name: Verify exact owner pin and all seven schema blobs
        run: |
          test "$(git -C _interop/periph rev-parse HEAD)" = a36c2d7c42b0bb3f4b2e4c78b42b999be0fac6cd
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          lock=json.loads(Path('release/periph-consumer-pin.json').read_text())
          assert len(lock['schema_blobs'])==7
          for path,sha in lock['schema_blobs'].items():
              assert subprocess.check_output(['git','hash-object',path],text=True).strip()==sha
              assert Path(path).read_bytes()==(Path('_interop/periph')/path).read_bytes()
          PY
      - name: Install owner locked test dependencies, not services
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r _interop/periph/requirements-host.lock.txt
          python -m pip check
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - name: Actual owner mock status and actual browser consumer
        run: |
          python scripts/prepare_periph_consumer_fixture.py --owner _interop/periph --out _interop/periph-fixtures
          node --experimental-strip-types scripts/check_periph_consumer.mjs _interop/periph _interop/periph-fixtures
      - name: Compare owner Rust domain with inactive Console legacy
        run: |
          mkdir -p _interop/periph/crates/periph-core/examples/legacy
          cp services/api/src/peripherals.rs _interop/periph/crates/periph-core/examples/legacy/console_peripherals.rs
          cp scripts/periph_domain_compare.rs _interop/periph/crates/periph-core/examples/console_consumer_probe.rs
          cargo run --locked --manifest-path _interop/periph/Cargo.toml -p rgd-periph-core --example console_consumer_probe -- "$PWD/_interop/periph-fixtures/descriptor.json" "$PWD/_interop/periph-fixtures/status.json"
          cargo test --locked --manifest-path _interop/periph/Cargo.toml --workspace
