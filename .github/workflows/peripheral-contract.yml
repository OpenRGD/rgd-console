name: Peripheral Manager Candidate Contracts
on:
  push:
    paths:
      - 'contracts/console/v1/peripheral-*.schema.json'
      - 'examples/peripherals/**'
      - 'services/api/src/peripherals.rs'
      - 'services/api/src/main.rs'
      - 'services/peripheral-manager/**'
      - 'scripts/peripheral-contract.test.mjs'
      - 'scripts/peripheral-host-contract.test.mjs'
      - 'scripts/peripheral-host-preflight.sh'
      - '.github/workflows/peripheral-contract.yml'
      - '.github/workflows/verify.yml' # baseline CI changes also require candidate regression checks
  pull_request:
    paths:
      - 'contracts/console/v1/peripheral-*.schema.json'
      - 'examples/peripherals/**'
      - 'services/api/src/peripherals.rs'
      - 'services/api/src/main.rs'
      - 'services/peripheral-manager/**'
      - 'scripts/peripheral-contract.test.mjs'
      - 'scripts/peripheral-host-contract.test.mjs'
      - 'scripts/peripheral-host-preflight.sh'
      - '.github/workflows/peripheral-contract.yml'
      - '.github/workflows/verify.yml' # baseline CI changes also require candidate regression checks

permissions:
  contents: read

jobs:
  examples-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check generic Peripheral Manager schema/examples/security invariants
        run: node --test scripts/peripheral-contract.test.mjs scripts/peripheral-host-contract.test.mjs

  pure-rust-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Test only side-effect-free peripheral domain
        run: cargo test --manifest-path services/api/Cargo.toml peripherals::tests
      - name: Check formatting of peripheral Rust domain only
        run: rustfmt --edition 2021 --check services/api/src/peripherals.rs

  host-manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static compile of private host broker/installer/CLI
        run: python3 -m py_compile services/peripheral-manager/*.py
      - name: Mock-only systemd/Unix-socket/security/installer tests
        run: python3 -m unittest discover -s services/peripheral-manager/tests -p 'test_*.py' -v
      - name: Preflight script syntax and absent-device fallback (no machine changes)
        run: |
          bash -n scripts/peripheral-host-preflight.sh
          CONSOLE_SOURCE_DIR="$PWD" \
          PAKY_SOURCE_DIR="$RUNNER_TEMP/uninstalled-paky-source" \
            bash scripts/peripheral-host-preflight.sh > "$RUNNER_TEMP/peripheral-preflight.log"
          grep -Fq 'PREFLIGHT COMPLETE / NO CHANGES' "$RUNNER_TEMP/peripheral-preflight.log"
          grep -Fq 'No hardware serial port opened' "$RUNNER_TEMP/peripheral-preflight.log"
