name: One-time format Peripheral Manager
on:
  push:
    branches: [feat/imu-publisher-host-control-design]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/imu-publisher-host-control-design
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt only to the new inert peripheral module
        run: |
          rustfmt --edition 2021 services/api/src/peripherals.rs
          if ! git diff --quiet -- services/api/src/peripherals.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/api/src/peripherals.rs
            git commit -m "style(peripherals): rustfmt inert domain contract module"
            git push origin HEAD:feat/imu-publisher-host-control-design
          fi
